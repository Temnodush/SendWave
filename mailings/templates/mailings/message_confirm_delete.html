{% extends 'base.html' %}

{% block title %}Удалить сообщение — SendWave{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card feature-card border-danger">
                <div class="card-header bg-danger text-white border-danger">
                    <h5 class="mb-0">⚠️ Подтверждение удаления</h5>
                </div>
                <div class="card-body">
                    <p class="text-secondary-custom">Вы уверены, что хотите удалить сообщение:</p>
                    <p class="text-purple-light fs-5"><strong>{{ object.subject }}</strong></p>
                    <p class="text-muted-custom small">Это действие нельзя отменить.</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-danger rounded-pill px-4">
                                🗑️ Да, удалить
                            </button>
                            <a href="{% url 'mailings:message_list' %}" class="btn btn-outline-light rounded-pill px-4">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
