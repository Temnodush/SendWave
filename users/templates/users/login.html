{% extends 'base.html' %}

{% block title %}Вход — SendWave{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card feature-card border-purple-soft rounded-4 overflow-hidden">

                <!-- Заголовок -->
                <div class="card-header bg-transparent border-purple-soft p-4 text-center">
                    <h3 class="text-gradient mb-0 fw-semibold">Вход на сайт</h3>
                </div>

                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}

                        {% if form.errors %}
                            <div class="alert bg-danger bg-opacity-25 border-danger text-danger py-2 rounded-3">
                                Неверный email или пароль
                            </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label text-purple-accent">Email</label>
                            <input type="email"
                                   name="username"
                                   id="id_username"
                                   class="form-control form-control-lg bg-dark text-light border-purple-soft rounded-3"
                                   placeholder="Введите email"
                                   value="{{ form.username.value|default:'' }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label text-purple-accent">Пароль</label>
                            <input type="password"
                                   name="password"
                                   id="id_password"
                                   class="form-control form-control-lg bg-dark text-light border-purple-soft rounded-3"
                                   placeholder="Введите пароль"
                                   required>
                        </div>

                        <!-- Ссылка на сброс пароля -->
                        <div class="mb-4 text-end">
                            <a href="{% url 'users:password_reset' %}" class="text-purple-light text-decoration-none small">
                                Забыли пароль?
                            </a>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-purple-gradient btn-lg rounded-3 shadow-neon">
                                Войти
                            </button>
                        </div>
                    </form>
                </div>

                <div class="card-footer bg-transparent border-purple-soft text-center py-3">
                    <span class="text-secondary-custom">Нет аккаунта?</span>
                    <a href="{% url 'users:register' %}" class="text-purple-light text-decoration-none fw-semibold ms-1">
                        Зарегистрируйтесь
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
