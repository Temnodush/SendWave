{% extends 'base.html' %}

{% block title %}Главная — SendWave{% endblock %}

{% block content %}

<style>
    .auth-header-gradient {
        background: linear-gradient(135deg, #A061B9 0%, #6B2893 100%);
    }
</style>

<div class="auth-overlay">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                    <div class="auth-header-gradient p-4 text-center">
                        <h3 class="text-white mb-0 fw-semibold">Вход на сайт</h3>
                    </div>

                    <div class="card-body p-4">
                        <form method="post">
                            {% csrf_token %}

                            {% if form.errors %}
                                <div class="alert alert-danger py-2">
                                    Неверный email или пароль
                                </div>
                            {% endif %}

                            <div class="mb-3">
                                <input type="email"
                                       name="username"
                                       class="form-control form-control-lg rounded-3"
                                       placeholder="Email"
                                       value="{{ form.username.value|default:'' }}"
                                       required>
                            </div>

                            <div class="mb-4">
                                <input type="password"
                                       name="password"
                                       class="form-control form-control-lg rounded-3"
                                       placeholder="Пароль"
                                       required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-purple btn-lg rounded-3">
                                    Войти
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer  text-center py-3 border-0">
                        <span class="text-muted">Нет аккаунта?</span>
                        <a href="{% url 'users:register' %}" class="text-decoration-none fw-semibold">
                            Зарегистрируйтесь
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
