{% extends 'base.html' %}

{% block title %}Пароль изменён — SendWave{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card feature-card border-purple-soft text-center p-5">
                <div class="feature-icon mb-4">✅</div>
                <h3 class="text-gradient mb-3">Пароль успешно изменён!</h3>
                <p class="text-secondary-custom mb-4">
                    Ваш пароль был успешно обновлён. Теперь вы можете войти 
                    в систему, используя новый пароль.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'users:login' %}" class="btn btn-purple-gradient rounded-pill px-5 shadow-neon">
                        Войти в систему
                    </a>
                    <a href="{% url 'mailings:home' %}" class="btn btn-outline-light rounded-pill px-4">
                        На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
