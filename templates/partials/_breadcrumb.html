{% load static %}

{% if show_nav %}
<div class="container pt-4">
    <div class="d-flex justify-content-between align-items-center">
        <!-- Кнопка назад -->
        <button type="button"
                class="btn btn-outline-light rounded-pill px-4"
                onclick="history.back();">
            ← Назад
        </button>

        <!-- Хлебные крошки -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item">
                    <a href="{% url 'mailings:home' %}" class="text-purple-light text-decoration-none">🏠</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="{% url 'mailings:dashboard' %}" class="text-purple-light text-decoration-none">Dashboard</a>
                </li>
                {% if parent_name %}
                <li class="breadcrumb-item">
                    <a href="{{ parent_url }}" class="text-purple-light text-decoration-none">{{ parent_name }}</a>
                </li>
                {% endif %}
                {% if current_name %}
                <li class="breadcrumb-item active text-secondary-custom">{{ current_name }}</li>
                {% endif %}
            </ol>
        </nav>
    </div>
</div>
{% endif %}
